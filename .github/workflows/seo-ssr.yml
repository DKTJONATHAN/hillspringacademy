name: SEO SSR regression checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker.js"
      - "vite.config.js"
      - "wrangler.jsonc"
      - "index.html"
      - "public/**"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/seo-ssr.yml"
  pull_request:
    paths:
      - "src/**"
      - "worker.js"
      - "vite.config.js"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/seo-ssr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-ssr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build client and server bundles
        run: npm run build
      - name: Test server-rendered routes and Worker HTML
        run: npm run test:seo-ssr

  deploy-worker:
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build client and server bundles
        run: npm run build
      - name: Deploy Hillspring Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc
      - name: Verify live SSR HTML after deployment
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            local path="$1"
            local expected="$2"
            local expected_status="$3"
            local headers_file
            local html_file
            headers_file="$(mktemp)"
            html_file="$(mktemp)"
            local status
            status="$(curl --silent --show-error --location --dump-header "$headers_file" --output "$html_file" --write-out '%{http_code}' "https://hillspringsacademy.sc.ke${path}?__ssr_verify=${GITHUB_RUN_ID}")"
            test "$status" = "$expected_status"
            grep -Eiq '^x-ssr: 1' "$headers_file"
            grep -Fq "$expected" "$html_file"
            rm -f "$headers_file" "$html_file"
          }
          check_page "/fees" "<title>School Fees 2027 | Hill Springs Academy, Maua</title>" "200"
          check_page "/blog/cbe-at-home-learning-beyond-the-classroom" "<title>How Parents Can Support Competency-Based Education (CBE) at Home in Kenya | Hill Springs Academy, Maua</title>" "200"
          check_page "/parent" '<meta name="robots" content="noindex,follow" />' "200"
          check_page "/blog/not-a-real-article" '<meta name="robots" content="noindex,follow" />' "404"
      - name: Report missing Cloudflare deployment secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Worker deployment skipped. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic deployment."
