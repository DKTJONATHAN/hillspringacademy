name: SEO SSR regression checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker.js"
      - "vite.config.js"
      - "wrangler.jsonc"
      - "index.html"
      - "public/**"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/seo-ssr.yml"
  pull_request:
    paths:
      - "src/**"
      - "worker.js"
      - "vite.config.js"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/seo-ssr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-ssr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build client and server bundles
        run: npm run build
      - name: Test server-rendered routes and Worker HTML
        run: npm run test:seo-ssr

  deploy-worker:
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build client and server bundles
        run: npm run build
      - name: Deploy Hillspring Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc
      - name: Verify live SSR HTML after deployment
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          # Clear stale HTML previously cached by the Pages/static delivery path.
          zone_id="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=hillspringsacademy.sc.ke" \
            | jq -r '.result[0].id // empty')"
          if [ -z "$zone_id" ]; then
            echo "::error::Could not resolve the Cloudflare zone ID. Check that the API token has Zone:Read and Cache Purge permissions."
            exit 1
          fi
          purge_response="$(curl --silent --show-error --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://hillspringsacademy.sc.ke/fees","https://hillspringsacademy.sc.ke/blog/cbe-at-home-learning-beyond-the-classroom","https://hillspringsacademy.sc.ke/parent","https://hillspringsacademy.sc.ke/blog/not-a-real-article"]}')"
          echo "$purge_response" | jq -e '.success == true' >/dev/null
          check_page() {
            local path="$1"
            local expected="$2"
            local expected_status="$3"
            local headers_file
            local html_file
            headers_file="$(mktemp)"
            html_file="$(mktemp)"
            local status
            status="$(curl --silent --show-error --location -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' --dump-header "$headers_file" --output "$html_file" --write-out '%{http_code}' "https://hillspringsacademy.sc.ke${path}?__ssr_verify=${GITHUB_RUN_ID}-$(date +%s)")"
            if [ "$status" != "$expected_status" ] || ! grep -Eiq '^x-ssr: 1' "$headers_file" || ! grep -Fq "$expected" "$html_file"; then
              echo "::error::SSR verification failed for ${path}: expected HTTP ${expected_status}, received HTTP ${status}."
              echo "Response headers:"
              cat "$headers_file"
              echo "Response title and robots directive:"
              grep -Eio '<title>[^<]*</title>|<meta name="robots"[^>]*>' "$html_file" | head -5 || true
              echo "First 500 response characters:"
              head -c 500 "$html_file" || true
              rm -f "$headers_file" "$html_file"
              return 1
            fi
            rm -f "$headers_file" "$html_file"
          }
          check_page "/fees" "<title>School Fees 2027 | Hill Springs Academy, Maua</title>" "200"
          check_page "/blog/cbe-at-home-learning-beyond-the-classroom" "<title>How Parents Can Support Competency-Based Education (CBE) at Home in Kenya | Hill Springs Academy, Maua</title>" "200"
          check_page "/parent" '<meta name="robots" content="noindex,follow" />' "200"
          check_page "/blog/not-a-real-article" '<meta name="robots" content="noindex,follow" />' "404"
      - name: Report missing Cloudflare deployment secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Worker deployment skipped. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic deployment."
