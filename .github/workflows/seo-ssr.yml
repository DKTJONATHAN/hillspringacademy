name: SEO SSR regression checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker.js"
      - "vite.config.js"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/seo-ssr.yml"
  pull_request:
    paths:
      - "src/**"
      - "worker.js"
      - "vite.config.js"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/seo-ssr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-ssr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build client and server bundles
        run: npm run build
      - name: Test server-rendered routes and Worker HTML
        run: npm run test:seo-ssr
