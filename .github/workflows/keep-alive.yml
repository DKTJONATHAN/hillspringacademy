name: Hill Springs Academy Supabase Keep Alive

on:
  # Daily real database queries are safer than relying on a twice-weekly schedule.
  # GitHub may delay or skip scheduled runs, so this reduces (but cannot eliminate) risk.
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify configuration
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY in GitHub repository Actions secrets."
            exit 1
          fi

      - name: Generate real database activity
        env:
          SUPABASE_URL: https://clpmfblwrpnqwbxgbtkd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          ping_table() {
            local table="$1"
            echo "Querying public.$table to generate database activity..."
            curl --fail --silent --show-error --location \
              --max-time 30 --connect-timeout 10 \
              --retry 3 --retry-delay 5 \
              --user-agent "Hill-Springs-Academy-Supabase-KeepAlive/2.0" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Accept: application/json" \
              "${SUPABASE_URL}/rest/v1/${table}?select=*&limit=1" \
              -o /dev/null
          }

          # Read-only queries: never create, alter, or delete school records.
          ping_table "school_applications"
          ping_table "school_subscribers"

          echo "Both Supabase database activity checks completed successfully."
