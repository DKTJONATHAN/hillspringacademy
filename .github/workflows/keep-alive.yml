name: Hill Springs Academy Keep Alive

on:
  schedule:
    # Twice weekly: Tuesday and Friday at 09:00 UTC (12:00 EAT)
    - cron: "0 9 * * 2"
    - cron: "0 9 * * 5"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping live website
        env:
          SITE_URL: https://hillspringsacademy.sc.ke/
        run: |
          set -e
          echo "Pinging $SITE_URL"
          curl --fail --silent --show-error --location             --max-time 30             --connect-timeout 10             --retry 3             --retry-delay 5             --user-agent "Hill-Springs-Academy-KeepAlive/1.0"             -o /dev/null             -w "HTTP %{http_code} in %{time_total}s\n"             "$SITE_URL"
