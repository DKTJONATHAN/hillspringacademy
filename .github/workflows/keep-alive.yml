name: Hill Springs Academy Supabase Keep Alive

on:
  schedule:
    # Twice weekly: Tuesday and Friday at 09:00 UTC (12:00 EAT)
    - cron: "0 9 * * 2"
    - cron: "0 9 * * 5"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: https://clpmfblwrpnqwbxgbtkd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY GitHub secret is not configured."
            exit 1
          fi

          echo "Generating Supabase database activity..."
          curl --fail --silent --show-error --location             --max-time 30             --connect-timeout 10             --retry 3             --retry-delay 5             --user-agent "Hill-Springs-Academy-Supabase-KeepAlive/1.0"             -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"             -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"             "${SUPABASE_URL}/rest/v1/school_subscribers?select=id&limit=1"             -o /dev/null

          echo "Supabase database activity request completed successfully."
